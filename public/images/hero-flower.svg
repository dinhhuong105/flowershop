<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-label="Hoa cách điệu">
  <defs>
    <radialGradient id="petalGold" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#e8b45a"/>
      <stop offset="100%" stop-color="#db9b3a"/>
    </radialGradient>
    <radialGradient id="petalCream" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f1ece2"/>
    </radialGradient>
  </defs>
  <!-- cành và lá -->
  <g fill="none" stroke="#0d6532" stroke-width="7" stroke-linecap="round">
    <path d="M260 500 C 250 400 255 330 260 270"/>
    <path d="M260 380 C 210 360 180 320 175 270"/>
    <path d="M260 400 C 310 380 340 340 345 290"/>
  </g>
  <g fill="#0f5c43">
    <ellipse cx="205" cy="315" rx="52" ry="20" transform="rotate(-32 205 315)"/>
    <ellipse cx="315" cy="335" rx="52" ry="20" transform="rotate(28 315 335)"/>
    <ellipse cx="225" cy="440" rx="46" ry="18" transform="rotate(-18 225 440)"/>
    <ellipse cx="300" cy="450" rx="46" ry="18" transform="rotate(20 300 450)"/>
  </g>
  <!-- hoa vàng lớn ở giữa -->
  <g>
    <g fill="url(#petalGold)">
      <ellipse cx="260" cy="150" rx="42" ry="72"/>
      <ellipse cx="260" cy="150" rx="42" ry="72" transform="rotate(72 260 150)"/>
      <ellipse cx="260" cy="150" rx="42" ry="72" transform="rotate(144 260 150)"/>
      <ellipse cx="260" cy="150" rx="42" ry="72" transform="rotate(216 260 150)"/>
      <ellipse cx="260" cy="150" rx="42" ry="72" transform="rotate(288 260 150)"/>
    </g>
    <circle cx="260" cy="150" r="30" fill="#01321f"/>
    <circle cx="260" cy="150" r="12" fill="#db9b3a"/>
  </g>
  <!-- hoa kem bên trái -->
  <g>
    <g fill="url(#petalCream)">
      <ellipse cx="150" cy="250" rx="30" ry="52"/>
      <ellipse cx="150" cy="250" rx="30" ry="52" transform="rotate(72 150 250)"/>
      <ellipse cx="150" cy="250" rx="30" ry="52" transform="rotate(144 150 250)"/>
      <ellipse cx="150" cy="250" rx="30" ry="52" transform="rotate(216 150 250)"/>
      <ellipse cx="150" cy="250" rx="30" ry="52" transform="rotate(288 150 250)"/>
    </g>
    <circle cx="150" cy="250" r="20" fill="#b8862b"/>
  </g>
  <!-- hoa kem bên phải -->
  <g>
    <g fill="url(#petalCream)">
      <ellipse cx="372" cy="260" rx="30" ry="52"/>
      <ellipse cx="372" cy="260" rx="30" ry="52" transform="rotate(72 372 260)"/>
      <ellipse cx="372" cy="260" rx="30" ry="52" transform="rotate(144 372 260)"/>
      <ellipse cx="372" cy="260" rx="30" ry="52" transform="rotate(216 372 260)"/>
      <ellipse cx="372" cy="260" rx="30" ry="52" transform="rotate(288 372 260)"/>
    </g>
    <circle cx="372" cy="260" r="20" fill="#b8862b"/>
  </g>
  <!-- nụ nhỏ -->
  <g fill="#db9b3a">
    <circle cx="205" cy="120" r="14"/>
    <circle cx="325" cy="130" r="14"/>
    <circle cx="380" cy="180" r="11"/>
    <circle cx="140" cy="170" r="11"/>
  </g>
</svg>
